name: Patch H3 per-reference semantic fit
on:
  push:
    branches: [agent/h3-per-reference-fit]
    paths: [.github/workflows/_agent-per-reference-fit.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/h3-per-reference-fit
      - name: Patch mixed scene/character reference fitting
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/common/runtime_adapter.py')
          s = path.read_text()

          old = '''def _job_for_prepare(job: H3Job) -> H3Job:\n    settings = _normalize_max_input_size(job.settings, job)\n    # Keep preprocessing semantics and the native H3 combo separate:\n    # inputImageFit drives our Pillow preprocessing while referenceFit is always\n    # one of the native MiniMax H3 values (`match` or `max`).\n    settings["inputImageFit"] = _normalize_preprocess_reference_fit(job.settings)\n    settings["referenceFit"] = _normalize_native_reference_size(job.settings)\n    return replace(job, settings=settings)\n'''
          new = '''def _job_for_prepare(job: H3Job) -> H3Job:\n    settings = _normalize_max_input_size(job.settings, job)\n    # Keep preprocessing semantics and the native H3 combo separate. Ref2VA's\n    # MiniMaxH3ReferenceToVideo node has one job-wide ref_image_size, so mixed\n    # semantic fitting is achieved by preprocessing each reference by role and\n    # then running the native reference node in `max`. An already-matched scene\n    # image is not upscaled by `max`, while raw character refs retain the native\n    # high-fidelity identity path.\n    requested_reference_fit = _normalize_preprocess_reference_fit(job.settings)\n    settings["inputImageFit"] = requested_reference_fit\n    settings["requestedReferenceFit"] = requested_reference_fit\n    settings["referenceFit"] = "max" if job.task_family == "h3_ref2va" else _normalize_native_reference_size(job.settings)\n    return replace(job, settings=settings)\n'''
          if old not in s:
              raise SystemExit('_job_for_prepare block not found')
          s = s.replace(old, new, 1)

          marker = '''def _resize_inside_max(image: Any, settings: dict[str, Any]) -> Any:\n'''
          helper = '''def _reference_materialization_mode(ref: dict[str, Any] | None, job: H3Job) -> str:\n    media = ref or {}\n    role = str(media.get("role") or "").strip().lower()\n    requested = str(media.get("fit") or media.get("referenceFit") or job.settings.get("requestedReferenceFit") or job.settings.get("inputImageFit") or "max")\n    requested = requested.strip().lower().replace("_", " ")\n\n    # Scene geometry is never displaced by a generic/max reference choice.\n    if role in {"scene", "scene_ref", "storyboard", "keyframe"}:\n        return "match"\n    # Character identity always uses the native H3 max path. We deliberately do\n    # not pre-resize here; the pinned H3 node performs its 2048-short-edge,\n    # down-only max handling itself.\n    if role in {"character", "character_ref", "subject"}:\n        return "native_max"\n    if requested in {"match", "crop", "fill", "frame", "match project frame", "match first image", "fill / crop", "fill/crop"}:\n        return "match"\n    if requested in {"contain", "pad", "fit", "fit full image", "fit full"}:\n        return "contain"\n    return "max"\n\n\ndef _materialize_semantic_reference_image(\n    ref: dict[str, Any] | None, target_dir: Path, job: H3Job\n) -> str:\n    mode = _reference_materialization_mode(ref, job)\n    if mode == "native_max":\n        return runtime.download_media(ref, target_dir)\n    return runtime.materialize_image(ref, target_dir, job, mode)\n\n\n'''
          if marker not in s:
              raise SystemExit('resize helper marker not found')
          s = s.replace(marker, helper + marker, 1)

          old = '''    reference_fit = runtime.normalize_reference_fit(job.settings)\n\n    for index, ref in enumerate(refs):\n        loader_path = optional.get(f"referenceImage{index}")\n        if not loader_path:\n            raise runtime.H3RuntimeError(f"Missing workflow path for reference image {index}")\n        runtime.set_path(\n            workflow,\n            loader_path,\n            runtime.materialize_image(runtime.media_ref(ref), media_dir, job, reference_fit),\n        )\n'''
          new = '''    for index, ref in enumerate(refs):\n        loader_path = optional.get(f"referenceImage{index}")\n        if not loader_path:\n            raise runtime.H3RuntimeError(f"Missing workflow path for reference image {index}")\n        media = runtime.media_ref(ref)\n        runtime.set_path(\n            workflow,\n            loader_path,\n            _materialize_semantic_reference_image(media, media_dir, job),\n        )\n'''
          if old not in s:
              raise SystemExit('Ref2VA image materialization block not found')
          s = s.replace(old, new, 1)
          path.write_text(s)
      - name: Assert mixed-fit contract
        shell: python
        run: |
          from pathlib import Path
          s = Path('src/common/runtime_adapter.py').read_text()
          assert 'settings["referenceFit"] = "max" if job.task_family == "h3_ref2va"' in s
          assert 'if role in {"scene", "scene_ref", "storyboard", "keyframe"}' in s
          assert 'return "match"' in s
          assert 'if role in {"character", "character_ref", "subject"}' in s
          assert 'return "native_max"' in s
          assert 'return runtime.download_media(ref, target_dir)' in s
          assert '_materialize_semantic_reference_image(media, media_dir, job)' in s
      - name: Validate runtime source
        run: |
          python -m py_compile src/common/runtime_adapter.py src/common/h3_runtime.py src/common/job_contract.py
          python scripts/validate_workflows.py
      - name: Commit runtime change
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/common/runtime_adapter.py
          git commit -m 'Support mixed scene and character reference fitting [skip ci]'
          git push origin HEAD:agent/h3-per-reference-fit
