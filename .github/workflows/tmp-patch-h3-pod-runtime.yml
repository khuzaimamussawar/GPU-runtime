name: Temporary Patch H3 Pod Runtime

on:
  push:
    branches: [main]
    paths:
      - '.github/h3-pod-runtime-patch-trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add explicit provider-side Comfy debug startup and validate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/pod/server.py')
          text = path.read_text()

          old = '''COMFY_URL = f"http://{COMFY_HOST}:{COMFY_PORT}"\n\nALLOWED_TASK_FAMILIES'''
          new = '''COMFY_URL = f"http://{COMFY_HOST}:{COMFY_PORT}"\nCOMFY_DEBUG_ENABLED = os.environ.get("H3_ENABLE_COMFY_UI_DEBUG", "0").strip().lower() in {"1", "true", "yes", "on"}\n\nALLOWED_TASK_FAMILIES'''
          if 'COMFY_DEBUG_ENABLED' not in text:
              assert old in text
              text = text.replace(old, new, 1)

          marker = '''def _comfy_post(path: str, payload: dict[str, Any] | None = None, timeout: int = 5) -> bool:\n'''
          insert = '''def _comfy_ready_local(timeout: int = 3) -> bool:\n    try:\n        with urllib.request.urlopen(f"http://127.0.0.1:{COMFY_PORT}/system_stats", timeout=timeout) as response:\n            response.read(1024)\n        return True\n    except Exception:\n        return False\n\n\ndef start_provider_debug_comfy() -> None:\n    if not COMFY_DEBUG_ENABLED or _comfy_ready_local():\n        return\n    cmd = [\n        "python3", "main.py", "--listen", "0.0.0.0", "--port", str(COMFY_PORT), "--disable-auto-launch"\n    ]\n    subprocess.Popen(cmd, cwd=COMFY_ROOT)\n    deadline = time.time() + int(os.environ.get("COMFY_STARTUP_TIMEOUT_SECONDS", "180"))\n    while time.time() < deadline:\n        if _comfy_ready_local():\n            print(f"[H3 Pod] provider-side ComfyUI debug ready on 0.0.0.0:{COMFY_PORT}", flush=True)\n            return\n        time.sleep(2)\n    raise RuntimeError("ComfyUI debug process did not become ready before timeout")\n\n\n'''
          if 'def start_provider_debug_comfy' not in text:
              assert marker in text
              text = text.replace(marker, insert + marker, 1)

          old = '''        "comfy": {"host": COMFY_HOST, "port": COMFY_PORT},\n'''
          new = '''        "comfy": {"host": COMFY_HOST, "port": COMFY_PORT, "debugExposed": COMFY_DEBUG_ENABLED, "ready": _comfy_ready_local()},\n'''
          if '"debugExposed": COMFY_DEBUG_ENABLED' not in text:
              assert old in text
              text = text.replace(old, new, 1)

          old = '''def main() -> None:\n    if not POD_TOKEN:\n        print("[H3 Pod] WARNING: SCENEBUILDER_POD_TOKEN is missing; protected endpoints will reject requests", flush=True)\n    threading.Thread(target=worker_loop, name="h3-pod-worker", daemon=True).start()\n'''
          new = '''def main() -> None:\n    if not POD_TOKEN:\n        print("[H3 Pod] WARNING: SCENEBUILDER_POD_TOKEN is missing; protected endpoints will reject requests", flush=True)\n    if COMFY_DEBUG_ENABLED:\n        start_provider_debug_comfy()\n    threading.Thread(target=worker_loop, name="h3-pod-worker", daemon=True).start()\n'''
          if 'if COMFY_DEBUG_ENABLED:\n        start_provider_debug_comfy()' not in text:
              assert old in text
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY
          python3 -m py_compile src/pod/server.py src/common/runtime_adapter.py src/common/h3_runtime.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pod/server.py
          if ! git diff --cached --quiet; then
            git commit -m 'Add provider-side ComfyUI debug mode to H3 pod'
            git push origin HEAD:main
          fi
