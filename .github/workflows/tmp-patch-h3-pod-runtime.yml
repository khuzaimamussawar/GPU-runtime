name: Temporary Patch H3 Pod Runtime

on:
  push:
    branches: [main]
    paths:
      - '.github/h3-pod-runtime-patch-trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add child-aware cancellation and validate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/pod/server.py')
          text = path.read_text()

          old = '''    errors: list[dict[str, Any]] = field(default_factory=list)\n    cancel_requested: bool = False\n'''
          new = '''    errors: list[dict[str, Any]] = field(default_factory=list)\n    cancel_requested: bool = False\n    cancelled_job_ids: set[str] = field(default_factory=set)\n'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''            "errors": list(self.errors),\n            "cancelRequested": self.cancel_requested,\n'''
          new = '''            "errors": list(self.errors),\n            "cancelRequested": self.cancel_requested,\n            "cancelledJobIds": sorted(self.cancelled_job_ids),\n'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''    for index, raw_item in enumerate(items):\n        with STATE.lock:\n            if record.cancel_requested:\n                record.status = "cancelled"\n                record.progress_phase = "cancelled"\n                break\n\n        item = dict(raw_item)\n        job_id = _job_id(item)\n        try:\n'''
          new = '''    for index, raw_item in enumerate(items):\n        item = dict(raw_item)\n        job_id = _job_id(item)\n        child_cancelled = False\n        with STATE.lock:\n            if record.cancel_requested:\n                record.status = "cancelled"\n                record.progress_phase = "cancelled"\n                break\n            child_cancelled = job_id in record.cancelled_job_ids\n        if child_cancelled:\n            emit_event("job_cancelled", workloadId=workload_id, jobId=job_id)\n            continue\n\n        try:\n'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''            STATE.loaded_family = family\n            result_summary = {\n                "index": index,\n                "jobId": job_id,\n                "taskFamily": family,\n                "ok": bool(result.get("ok", True)),\n                "result": result,\n            }\n            with STATE.lock:\n                record.results.append(result_summary)\n            emit_event(\n                "job_completed",\n                workloadId=workload_id,\n                jobId=job_id,\n                taskFamily=family,\n                result=result,\n            )\n        except Exception as exc:\n            error = {\n'''
          new = '''            STATE.loaded_family = family\n            with STATE.lock:\n                child_cancelled = job_id in record.cancelled_job_ids\n            if child_cancelled:\n                emit_event("job_cancelled", workloadId=workload_id, jobId=job_id)\n                continue\n            result_summary = {\n                "index": index,\n                "jobId": job_id,\n                "taskFamily": family,\n                "ok": bool(result.get("ok", True)),\n                "result": result,\n            }\n            with STATE.lock:\n                record.results.append(result_summary)\n            emit_event(\n                "job_completed",\n                workloadId=workload_id,\n                jobId=job_id,\n                taskFamily=family,\n                result=result,\n            )\n        except Exception as exc:\n            with STATE.lock:\n                child_cancelled = job_id in record.cancelled_job_ids\n            if child_cancelled:\n                emit_event("job_cancelled", workloadId=workload_id, jobId=job_id)\n                release_models_for_family_switch()\n                continue\n            error = {\n'''
          assert old in text
          text = text.replace(old, new, 1)

          marker = '''        if path.startswith("/workloads/") and path.endswith("/cancel"):\n            workload_id = path[len("/workloads/") : -len("/cancel")].strip("/")\n'''
          replacement = '''        parts = [part for part in path.split("/") if part]\n        if len(parts) == 5 and parts[0] == "workloads" and parts[2] == "items" and parts[4] == "cancel":\n            workload_id = parts[1]\n            job_id = parts[3]\n            with STATE.lock:\n                record = STATE.workloads.get(workload_id)\n                if not record:\n                    self._send(HTTPStatus.NOT_FOUND, {"ok": False, "error": "Unknown workload"})\n                    return\n                record.cancelled_job_ids.add(job_id)\n                active = record.current_job_id == job_id\n            if active:\n                interrupt_current_generation()\n            emit_event("job_cancel_requested", workloadId=workload_id, jobId=job_id)\n            self._send(HTTPStatus.ACCEPTED, {"ok": True, "jobId": job_id, "cancelRequested": True})\n            return\n\n        if path.startswith("/workloads/") and path.endswith("/cancel"):\n            workload_id = path[len("/workloads/") : -len("/cancel")].strip("/")\n'''
          assert marker in text
          text = text.replace(marker, replacement, 1)

          path.write_text(text)
          PY
          python3 -m py_compile src/pod/server.py src/common/runtime_adapter.py src/common/h3_runtime.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pod/server.py
          git commit -m 'Add child-aware H3 pod cancellation'
          git push origin HEAD:main
