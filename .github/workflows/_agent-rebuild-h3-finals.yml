name: Rebuild merged H3 runtime finals

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/_agent-rebuild-h3-finals.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 720
    env:
      BUILDER_NAME: h3-merged-finals-${{ github.run_id }}-${{ github.run_attempt }}
      SERVER_TYPE: ccx43
      HETZNER_LOCATION: fsn1
      HETZNER_IMAGE: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create temporary SSH key
        id: sshkey
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p .tmp
          ssh-keygen -t ed25519 -f .tmp/h3_builder_key -N "" -C "h3-builder-${GITHUB_RUN_ID}"
          echo "key_path=${GITHUB_WORKSPACE}/.tmp/h3_builder_key" >> "$GITHUB_OUTPUT"
          echo "public_key=$(cat .tmp/h3_builder_key.pub)" >> "$GITHUB_OUTPUT"

      - name: Create temporary Hetzner builder
        id: create
        shell: bash
        env:
          HETZNER_TOKEN: ${{ secrets.HETZNER_TOKEN }}
          BUILDER_SSH_PUBLIC_KEY: ${{ steps.sshkey.outputs.public_key }}
        run: |
          set -Eeuo pipefail
          bash scripts/hetzner_create.sh

      - name: Wait for SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          bash scripts/wait_for_ssh.sh "${{ steps.create.outputs.server_ip }}" "${{ steps.sshkey.outputs.key_path }}" 900

      - name: Build and push changed H3 runtime chains
        shell: bash
        env:
          REMOTE_IP: ${{ steps.create.outputs.server_ip }}
          SSH_KEY_PATH: ${{ steps.sshkey.outputs.key_path }}
          BUILD_TARGET: smoke
          BUILD_TARGETS: fl2va-workflow,fl2va-loras,runpod-fl2va,novita-fl2va,ref2va-workflow,ref2va-loras,runpod-ref2va,novita-ref2va
          IMAGE_TAG: latest
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GH_FH_TOKEN_MM_H3_SERVERLESS: ${{ secrets.GH_FH_TOKEN_MM_H3_SERVERLESS }}
          DOCKER_BUILD_ATTEMPTS: "2"
        run: |
          set -Eeuo pipefail
          ssh -i "${SSH_KEY_PATH}" \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=20 \
            -o TCPKeepAlive=yes \
            "root@${REMOTE_IP}" \
            "BUILD_TARGET='${BUILD_TARGET}' \
             BUILD_TARGETS='${BUILD_TARGETS}' \
             IMAGE_TAG='${IMAGE_TAG}' \
             DOCKERHUB_USERNAME='${DOCKERHUB_USERNAME}' \
             DOCKERHUB_TOKEN='${DOCKERHUB_TOKEN}' \
             HF_TOKEN='${HF_TOKEN}' \
             GH_FH_TOKEN_MM_H3_SERVERLESS='${GH_FH_TOKEN_MM_H3_SERVERLESS}' \
             DOCKER_BUILD_ATTEMPTS='${DOCKER_BUILD_ATTEMPTS}' \
             GITHUB_REPOSITORY='${GITHUB_REPOSITORY}' \
             GITHUB_REF_NAME='${GITHUB_REF_NAME}' \
             bash -s" < scripts/remote_build.sh

      - name: Delete temporary Hetzner builder
        if: always() && steps.create.outputs.server_id != ''
        shell: bash
        env:
          HETZNER_TOKEN: ${{ secrets.HETZNER_TOKEN }}
          SERVER_ID: ${{ steps.create.outputs.server_id }}
        run: |
          set -Eeuo pipefail
          bash scripts/hetzner_delete.sh "${SERVER_ID}" "${{ steps.create.outputs.ssh_key_id }}"

      - name: Remove one-shot workflow after success
        if: success()
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/_agent-rebuild-h3-finals.yml
          git commit -m "Remove one-shot H3 runtime rebuild workflow"
          git push origin HEAD:main
