name: Validate Enhancer H3 parity

on:
  pull_request:
    paths:
      - 'enhancer/src/callbacks.py'
      - 'enhancer/src/server.py'
      - 'enhancer/src/gpu.py'
      - 'enhancer/tests/test_callbacks.py'
      - 'enhancer/tests/test_gpu_qualification.py'
      - 'enhancer/tests/test_h3_lifecycle_parity.py'
      - '.github/workflows/validate-enhancer-h3-parity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax check Enhancer runtime
        run: |
          python -m py_compile \
            enhancer/src/callbacks.py \
            enhancer/src/server.py \
            enhancer/src/gpu.py \
            enhancer/tests/test_callbacks.py \
            enhancer/tests/test_gpu_qualification.py \
            enhancer/tests/test_h3_lifecycle_parity.py
      - name: Run lightweight lifecycle and NVENC qualification tests
        run: |
          python -m pytest -q \
            enhancer/tests/test_callbacks.py \
            enhancer/tests/test_gpu_qualification.py \
            enhancer/tests/test_h3_lifecycle_parity.py
